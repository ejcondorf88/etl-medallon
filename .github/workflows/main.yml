
name: ETL Supermercados Andinos

on:
  push:
    paths:
      - 'data/bronce/**'
  workflow_dispatch:

jobs:
  ejecutar-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl Office365-REST-Python-Client

      - name: Ejecutar pipeline
        run: python main.py

      - name: Subir Excel a SharePoint
        env:
          SHAREPOINT_URL: ${{ secrets.SHAREPOINT_URL }}
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_USERNAME: ${{ secrets.SHAREPOINT_USERNAME }}
          SHAREPOINT_PASSWORD: ${{ secrets.SHAREPOINT_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          from office365.sharepoint.client_context import ClientContext

          site_url = os.environ["SHAREPOINT_URL"]
          tenant_id = os.environ["SHAREPOINT_TENANT_ID"]
          client_id = os.environ["SHAREPOINT_CLIENT_ID"]
          username = os.environ["SHAREPOINT_USERNAME"]
          password = os.environ["SHAREPOINT_PASSWORD"]

          ctx = ClientContext(site_url).with_username_and_password(
              tenant_id,
              client_id,
              username,
              password
          )

          local_path = "data/oro/modelo_estrella.xlsx"

          if not os.path.isfile(local_path):
              raise FileNotFoundError(
                  f"No se encontró el archivo: {local_path}"
              )

          target_folder = ctx.web.get_folder_by_server_relative_url(
              "/sites/xd123/Documentos compartidos"
          )

          with open(local_path, "rb") as f:
              file_content = f.read()

          target_folder.upload_file(
              "modelo_estrella.xlsx",
              file_content
          ).execute_query()

          print("Archivo subido correctamente a SharePoint")
          EOF

      - name: Subir resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelo-estrella
          path: |
            data/oro/
            data/calidad/
          if-no-files-found: warn
