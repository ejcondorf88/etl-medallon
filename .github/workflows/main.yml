name: ETL Supermercados Andinos

on:
  push:
    paths:
      - 'data/bronce/ventas.csv'   # solo se activa si cambia este archivo
      - 'data/bronce/**'           # o cualquier archivo de bronce
  workflow_dispatch:               # también se puede ejecutar manualmente

jobs:
  ejecutar-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Ejecutar pipeline
        run: python main.py

      - name: Subir resultados (capa oro)
        uses: actions/upload-artifact@v4
        with:
          name: modelo-estrella
          path: |
            data/oro/
            data/calidad/
